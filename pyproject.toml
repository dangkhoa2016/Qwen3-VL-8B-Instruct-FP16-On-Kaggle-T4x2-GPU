[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3vl-t4x2"
version = "1.0.0"
description = "Qwen3-VL-8B-Instruct FP16 production-style Kaggle T4x2 showcase"
authors = [{name = "Đăng Khoa", email = "i.am@dangkhoa.dev"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["qwen3-vl", "multimodal", "kaggle", "tesla-t4", "fastapi", "fp16"]
dependencies = [
  "accelerate==1.15.0",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "torch==2.14.1",
  "transformers==5.19.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/dangkhoa2016/Qwen3-VL-8B-Instruct-FP16-On-Kaggle-T4x2-GPU"
Documentation = "https://github.com/dangkhoa2016/Qwen3-VL-8B-Instruct-FP16-On-Kaggle-T4x2-GPU/tree/main/docs"
